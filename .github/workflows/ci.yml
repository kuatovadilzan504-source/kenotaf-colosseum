name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: idos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: idos/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          VITE_KZ_NS: kz_
          VITE_KZ_CHAIN: mainnet
      - name: Game scripts parse
        working-directory: game
        run: for f in $(find js -name '*.js'); do node --check "$f" || exit 1; done
